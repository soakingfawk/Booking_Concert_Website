{% extends 'booking/base.html' %}

{% block title %}Новый пароль{% endblock %}

{% block content %}
<div class="max-w-md mx-auto mt-10">
    <h2 class="text-2xl font-semibold text-center mb-6">Установка нового пароля</h2>

    {% if form.errors %}
        <div class="bg-red-100 text-red-700 p-2 rounded mb-4">
            {{ form.errors }}
        </div>
    {% endif %}

    <form method="post" class="space-y-4">
        {% csrf_token %}
        <div>
            <label for="new_password1" class="block mb-1 font-medium">Новый пароль</label>
            <input type="password" name="new_password1" id="new_password1" required
                   class="w-full border border-gray-300 rounded p-2">
        </div>

        <div>
            <label for="new_password2" class="block mb-1 font-medium">Подтвердите новый пароль</label>
            <input type="password" name="new_password2" id="new_password2" required
                   class="w-full border border-gray-300 rounded p-2">
        </div>

        <div class="pt-4">
            <button type="submit"
                    class="w-full bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 transition">
                Сохранить
            </button>
        </div>
    </form>
</div>
{% endblock %}
