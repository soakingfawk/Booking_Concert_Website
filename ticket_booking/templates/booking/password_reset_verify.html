{% extends 'booking/base.html' %}

{% block title %}Ввод кода сброса пароля{% endblock %}

{% block content %}

<div class="text-center"> <h2 class="text-2xl font-semibold mb-4">Подтверждение сброса пароля</h2> <p class="mb-4">Введите код, отправленный на вашу электронную почту:</p>
    {% if error %}
    <div class="bg-red-100 text-red-700 p-2 rounded mb-4">
        {{ error }}
    </div>
{% endif %}

<form method="post" class="max-w-md mx-auto">
    {% csrf_token %}
    <input type="text" name="verification_code" placeholder="Код подтверждения" required
           class="border border-gray-300 rounded p-2 w-full mb-4">
    <button type="submit"
            class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 transition">
        Подтвердить
    </button>
</form>
</div> {% endblock %}
